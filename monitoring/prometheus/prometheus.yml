global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: prometheus

    static_configs:
      - targets:
          - localhost:9090

  - job_name: vllm

    metrics_path: /metrics

    static_configs:
      - targets:
          - vllm-service.llm-serving.svc.cluster.local:8000

  - job_name: envoy

    metrics_path: /stats/prometheus

    static_configs:
      - targets:
          - llm-gateway.llm-serving.svc.cluster.local:8080