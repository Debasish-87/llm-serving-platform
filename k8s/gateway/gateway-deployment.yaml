apiVersion: apps/v1
kind: Deployment

metadata:
  name: llm-gateway
  namespace: llm-serving
  labels:
    app: llm-gateway

spec:
  replicas: 1

  selector:
    matchLabels:
      app: llm-gateway

  template:
    metadata:
      labels:
        app: llm-gateway

    spec:
      containers:
        - name: envoy

          image: envoyproxy/envoy:v1.31-latest

          ports:
            - name: http
              containerPort: 8080

          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy/envoy.yaml
              subPath: envoy.yaml

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20

      volumes:
        - name: envoy-config
          configMap:
            name: envoy-config
