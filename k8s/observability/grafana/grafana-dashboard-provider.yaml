apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-dashboard-provider
  namespace: llm-serving

data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: default
        orgId: 1
        folder: LLM Serving
        type: file
        disableDeletion: false
        editable: true

        options:
          path: /opt/grafana-dashboards
