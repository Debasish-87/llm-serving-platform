apiVersion: v1
kind: ConfigMap

metadata:
  name: otel-collector-config
  namespace: llm-serving

data:
  otel-collector-config.yaml: |
    receivers:

      otlp:
        protocols:

          grpc:
            endpoint: 0.0.0.0:4317

          http:
            endpoint: 0.0.0.0:4318

    processors:

      batch:

    exporters:

      otlp:
        endpoint: tempo:4317
        tls:
          insecure: true

      debug:
        verbosity: basic

    service:

      pipelines:

        traces:

          receivers:
            - otlp

          processors:
            - batch

          exporters:
            - otlp
            - debug
