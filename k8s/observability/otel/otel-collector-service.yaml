apiVersion: v1
kind: Service

metadata:
  name: otel-collector
  namespace: llm-serving

spec:
  type: ClusterIP

  selector:
    app: otel-collector

  ports:
    - name: otlp-grpc
      protocol: TCP
      port: 4317
      targetPort: otlp-grpc

    - name: otlp-http
      protocol: TCP
      port: 4318
      targetPort: otlp-http
