apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: fluent-bit
  namespace: llm-serving
  labels:
    app: fluent-bit

spec:
  selector:
    matchLabels:
      app: fluent-bit

  template:
    metadata:
      labels:
        app: fluent-bit

    spec:
      serviceAccountName: fluent-bit

      containers:
        - name: fluent-bit

          image: fluent/fluent-bit:3.1.8

          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf

            - name: varlog
              mountPath: /var/log
              readOnly: true

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

      volumes:
        - name: config
          configMap:
            name: fluent-bit-config

        - name: varlog
          hostPath:
            path: /var/log
