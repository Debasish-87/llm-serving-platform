apiVersion: apps/v1
kind: Deployment

metadata:
  name: alertmanager
  namespace: llm-serving
  labels:
    app: alertmanager

spec:
  replicas: 1

  selector:
    matchLabels:
      app: alertmanager

  template:
    metadata:
      labels:
        app: alertmanager

    spec:
      containers:
        - name: alertmanager

          image: prom/alertmanager:v0.28.1

          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"

          ports:
            - name: http
              containerPort: 9093

          volumeMounts:
            - name: alertmanager-config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml

            - name: alertmanager-storage
              mountPath: /alertmanager

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"

      volumes:
        - name: alertmanager-config
          configMap:
            name: alertmanager-config

        - name: alertmanager-storage
          emptyDir: {}
