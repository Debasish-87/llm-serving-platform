apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config
  namespace: llm-serving

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager.llm-serving.svc.cluster.local:9093

    scrape_configs:

      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: vllm
        metrics_path: /metrics
        static_configs:
          - targets:
              - vllm-service.llm-serving.svc.cluster.local:8000

      - job_name: envoy
        metrics_path: /stats/prometheus
        static_configs:
          - targets:
              - llm-gateway.llm-serving.svc.cluster.local:8080

      - job_name: dcgm-exporter
        metrics_path: /metrics
        static_configs:
          - targets:
              - dcgm-exporter.llm-serving.svc.cluster.local:9400
