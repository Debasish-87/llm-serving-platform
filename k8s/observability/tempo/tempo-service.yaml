apiVersion: v1
kind: Service

metadata:
  name: tempo
  namespace: llm-serving

spec:
  type: ClusterIP

  selector:
    app: tempo

  ports:
    - name: http
      protocol: TCP
      port: 3200
      targetPort: http

    - name: otlp-grpc
      protocol: TCP
      port: 4317
      targetPort: otlp-grpc

    - name: otlp-http
      protocol: TCP
      port: 4318
      targetPort: otlp-http
