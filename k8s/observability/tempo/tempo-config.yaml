apiVersion: v1
kind: ConfigMap

metadata:
  name: tempo-config
  namespace: llm-serving

data:
  tempo.yaml: |
    server:
      http_listen_port: 3200

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317

            http:
              endpoint: 0.0.0.0:4318

    ingester:
      max_block_duration: 5m

    compactor:
      compaction:
        block_retention: 24h

    storage:
      trace:
        backend: local

        local:
          path: /tempo/blocks

        wal:
          path: /tempo/wal

    overrides:
      defaults:
        metrics_generator:
          processors:
            - service-graphs
            - span-metrics
