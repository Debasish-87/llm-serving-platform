apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "vllm-serving.fullname" . }}

  labels:
    {{- include "vllm-serving.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  strategy:
    type: {{ .Values.strategy.type }}

    rollingUpdate:
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}

  selector:
    matchLabels:
      {{- include "vllm-serving.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "vllm-serving.selectorLabels" . | nindent 8 }}

    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}

      securityContext:
        runAsNonRoot: {{ .Values.securityContext.pod.runAsNonRoot }}

      containers:
        - name: vllm

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.container.allowPrivilegeEscalation }}

            capabilities:
              drop:
                {{- toYaml .Values.securityContext.container.capabilities.drop | nindent 16 }}

          ports:
            - name: http
              containerPort: 8000

          args:
            - "--model"
            - "{{ .Values.model.name }}"

            - "--host"
            - "0.0.0.0"

            - "--port"
            - "8000"

            - "--gpu-memory-utilization"
            - "{{ .Values.vllm.gpuMemoryUtilization }}"

            - "--max-model-len"
            - "{{ .Values.vllm.maxModelLen }}"

            - "--max-num-seqs"
            - "{{ .Values.vllm.maxNumSeqs }}"

          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}

            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
              nvidia.com/gpu: {{ .Values.resources.limits.gpu }}

          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}

          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.periodSeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}

          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}