apiVersion: v1
kind: Service

metadata:
  name: {{ include "vllm-serving.fullname" . }}

  labels:
    {{- include "vllm-serving.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "vllm-serving.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http